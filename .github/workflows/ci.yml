name: verify

on:
  push:
  pull_request:

permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact source
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch -q origin "${{ github.sha }}"
          git checkout -q --detach "${{ github.sha }}"
      - name: Check supported runner Python
        run: python3 -c "import sys; assert sys.version_info >= (3, 11)"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m unittest discover -s tests -v
      - run: python tools/verify_repository.py
      - name: Exact publication payload
        run: python3 tools/prepublish_gate.py --commit "${{ github.sha }}"
